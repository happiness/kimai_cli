name: release

# Builds binaries for Linux, macOS and Windows and attaches them to a
# GitHub Release whenever a version tag (e.g. v1.0.0) is pushed.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Keep building the other platforms if one of them fails.
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 } # Intel Mac
          - { goos: darwin, goarch: arm64 } # Apple Silicon Mac
          - { goos: windows, goarch: amd64, ext: .exe }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o kimai_cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .

      # Only store the binary here; the release is created once, in the job below.
      - uses: actions/upload-artifact@v4
        with:
          name: kimai_cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: kimai_cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
