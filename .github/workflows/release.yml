name: release

# Builds binaries for Linux, macOS and Windows and attaches them to a
# GitHub Release whenever a version tag (e.g. v1.0.0) is pushed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the release

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 } # Intel Mac
          - { goos: darwin, goarch: arm64 } # Apple Silicon Mac
          - { goos: windows, goarch: amd64, ext: .exe }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o kimai_cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .

      - uses: softprops/action-gh-release@v2
        with:
          files: kimai_cli-*
